name: Sync to Gitee
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 拉取完整提交历史

      - name: Configure Git
        run: |
          git config --global user.name "An3035"
          git config --global user.email "1613870384@qq.com"

      - name: Sync to Gitee
        run: |
          # 添加Gitee远程仓库（用HTTPS+令牌方式，不需要SSH）
          git remote add gitee https://${{ secrets.GITEE_TOKEN }}@gitee.com/zhangan11/zhangan11.git
          
          # 强制推送所有分支和标签到Gitee
          git push -f gitee --all
          git push -f gitee --tags
