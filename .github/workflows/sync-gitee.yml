name: Sync to Gitee
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "An3035"
          git config --global user.email "1613870384@qq.com"
          git config --global credential.helper store

      - name: Sync to Gitee
        run: |
          # 验证令牌是否存在（调试用）
          if [ -z "${{ secrets.GITEE_TOKEN }}" ]; then
            echo "错误：GITEE_TOKEN 未配置"
            exit 1
          fi
          
          # 添加Gitee远程仓库（标准HTTPS令牌格式）
          git remote set-url origin https://${{ secrets.GITEE_TOKEN }}@gitee.com/zhangan11/zhangan11.git
          
          # 强制推送所有内容
          git push -f origin main
          git push -f origin --tags
