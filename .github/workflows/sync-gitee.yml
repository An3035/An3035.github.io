name: Sync to Gitee
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/An3035  # 你的GitHub用户名
          dst: gitee/zhangan11  # 你的Gitee用户名（已修正）
          static_list: "An3035.github.io"  # 你的GitHub仓库名
          dst_key: ${{ secrets.GITEE_TOKEN }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          force_update: true
          debug: true
