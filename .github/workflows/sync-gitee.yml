name: Sync to Gitee
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: git push -f https://zhangan11:${{ secrets.GITEE_TOKEN }}@gitee.com/zhangan11/an3035.git main
